[package]
name = 'nexuss0781/nexussai'
version = '0.1.29'
description = 'Nexuss AI autonomous agent with Filesystem Kit integration'
entrypoint = 'node src/server.cjs'
private = true

[fs]
'/app/dist' = 'dist'
'/app/src' = 'src'

[env]
NAR_BASE_URL = 'https://omniouter-vercel.vercel.app'
NAR_API_KEY = 'my-super-secret-gateway-token-123'
NAR_MODEL = 'auto'
FILESYSTEM_KIT_URL = 'https://filesystem-kit.wasmer.app'
