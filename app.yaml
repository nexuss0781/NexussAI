kind: wasmer.io/App.v0
owner: nexuss0781
name: nexussai
package: .
env:
  FILESYSTEM_KIT_URL: https://filesystem-kit.wasmer.app
  STATIC_DIR: /public
annotations:
  anybuild.run/config:
    commands:
      start: node src/server.cjs
    edgejs_enable: true
    edgejs_precompile: true
    name: out
    node_install_inputs:
      - package.json
    node_package_manager: npm
    node_package_name: nexuss-ai
    node_remove_native_binaries: true
    node_server: express
    npm_version: '11'
  anybuild.run/provider: node
  anybuild.run/version: 0.29.0
  wasmer.io/version: 7.4.2
