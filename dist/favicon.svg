<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient matching NexussFace exactly -->
    <radialGradient id="faceBg" cx="30%" cy="20%" r="120%">
      <stop offset="0%" stop-color="#E8E5DD" />
      <stop offset="55%" stop-color="#DCD9D0" />
      <stop offset="100%" stop-color="#D0CDBF" />
    </radialGradient>
    
    <!-- Phosphor color for eyes & mouth -->
    <linearGradient id="phosphor" x1="50" y1="20" x2="50" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#201738" />
      <stop offset="100%" stop-color="#201738" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="squircleBorder" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#201738" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#201738" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter for maximum high-contrast visibility -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- The Squircle Face Container (No external aura/backdrop to maximize favicon size) -->
  <rect x="2" y="2" width="96" height="96" rx="25" fill="url(#faceBg)" stroke="url(#squircleBorder)" stroke-width="1.8" />

  <!-- Inner Squircle Accent Rim -->
  <rect x="6" y="6" width="88" height="88" rx="22" stroke="#201738" stroke-width="0.8" stroke-dasharray="2 3" fill="none" opacity="0.2" />

  <g>
    <!-- Left Capsule Eye -->
    <rect x="32" y="27" width="10" height="21" rx="5" fill="url(#phosphor)" />

    <!-- Right Capsule Eye -->
    <rect x="58" y="27" width="10" height="21" rx="5" fill="url(#phosphor)" />

    <!-- Smiling Playful Confident Mouth -->
    <path d="M 32 62 C 38 67.5, 62 67.5, 68 62" stroke="#201738" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.98" />
  </g>
</svg>
