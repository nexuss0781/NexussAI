<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient matching NexussFace exactly -->
    <radialGradient id="faceBg" cx="30%" cy="20%" r="120%">
      <stop offset="0%" stop-color="#201738" />
      <stop offset="55%" stop-color="#110c22" />
      <stop offset="100%" stop-color="#080512" />
    </radialGradient>
    
    <!-- Phosphor Gradient for eyes & mouth -->
    <linearGradient id="phosphor" x1="50" y1="20" x2="50" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f5edff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="squircleBorder" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter for maximum high-contrast visibility -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- The Squircle Face Container (No external aura/backdrop to maximize favicon size) -->
  <rect x="2" y="2" width="96" height="96" rx="25" fill="url(#faceBg)" stroke="url(#squircleBorder)" stroke-width="1.8" />

  <!-- Inner Squircle Accent Rim -->
  <rect x="6" y="6" width="88" height="88" rx="22" stroke="rgba(192, 132, 252, 0.25)" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />

  <g filter="url(#glow)">
    <!-- Left Capsule Eye -->
    <rect x="32" y="27" width="10" height="21" rx="5" fill="url(#phosphor)" />
    <circle cx="35" cy="31.5" r="1.3" fill="#ffffff" opacity="0.95" />

    <!-- Right Capsule Eye -->
    <rect x="58" y="27" width="10" height="21" rx="5" fill="url(#phosphor)" />
    <circle cx="61" cy="31.5" r="1.3" fill="#ffffff" opacity="0.95" />

    <!-- Smiling Confident Mouth -->
    <path d="M 34 63.2 C 40 65.0, 60 65.0, 66 63.2" stroke="#f5edff" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.98" />

    <!-- Lower Lip Reflection -->
    <path d="M 43 68.5 Q 50 69.5 57 68.5" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>
</svg>
